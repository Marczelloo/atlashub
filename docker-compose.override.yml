# Docker Compose override for development
# Usage: docker compose --profile dev up

services:
  # PostgreSQL and MinIO already expose localhost-only ports in the base
  # compose file. Re-declaring them here creates duplicate host bindings
  # whenever the dev profile is enabled together with production services.

  # Gateway runs locally in dev, not in Docker
  gateway:
    profiles: ['never'] # Disabled in dev

  # Dashboard runs locally in dev, not in Docker
  dashboard:
    profiles: ['never'] # Disabled in dev

  # Cloudflared not needed in local dev
  cloudflared:
    profiles: ['never'] # Disabled in dev
